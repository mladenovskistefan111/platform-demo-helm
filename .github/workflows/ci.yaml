name: CI

# Pull-request gate for the charts. Nothing runs on a plain push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  COSIGN_VERSION: v3.1.3
  KYVERNO_VERSION: v1.19.1
  KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  KUBERNETES_VERSION: 1.33.0

jobs:
  # ─── helm lint + render ───────────────────────────────────────────────────

  lint-and-render:
    name: Helm lint & render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          # Every chart except the umbrella first, then the umbrella (it packages the others).
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done
          helm dependency build platform-demo

      - name: helm lint
        run: |
          status=0
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            [ "$chart" = monitoring ] && continue # vendored upstream charts, not ours to lint
            args=()
            case "$chart" in
              product-catalog-db) args=(--set auth.password=x) ;;
              platform-demo) args=(--set product-catalog-db.auth.password=x) ;;
            esac
            echo "::group::helm lint $chart"
            helm lint "$chart" "${args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: helm template (every configuration we ship)
        run: |
          mkdir -p rendered
          helm template platform-demo ./platform-demo -f platform-demo/values-dev.yaml > rendered/umbrella-dev.yaml
          helm template platform-demo ./platform-demo --set product-catalog-db.auth.password=x > rendered/umbrella-default.yaml
          helm template platform-demo ./platform-demo -f platform-demo/values-prod.yaml \
            --set product-catalog-db.auth.existingSecret=s > rendered/umbrella-prod.yaml
          helm template platform-gateway ./platform-gateway > rendered/gateway.yaml
          # Not an environment add-on (its own Argo CD Application, project `secrets`): rendered here so kubeconform checks the ExternalSecrets.
          helm template external-secrets-config ./external-secrets-config > rendered/external-secrets-config.yaml
          helm template monitoring-local ./monitoring-local > rendered/monitoring-local.yaml
          # Every workload and add-on of every environment, rendered the way the ApplicationSets do.
          python3 .github/scripts/render-envs.py rendered
          wc -l rendered/*.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered
          path: rendered/
          retention-days: 7

  # ─── schema validation ────────────────────────────────────────────────────

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Validate rendered manifests against the Kubernetes and CRD schemas
        run: |
          ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml gitops/apps/*.yaml gitops/bootstrap/*.yaml

  # ─── misconfiguration scan ────────────────────────────────────────────────

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      # The charts that deploy to real clusters must be clean (HIGH/CRITICAL fail the build). Accepted findings, each with its reason:
      # .trivyignore.yaml.
      - name: Trivy config - application and gateway charts
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          trivyignores: .trivyignore.yaml
          skip-files: rendered/monitoring-local.yaml,rendered/env-dev-monitoring-local.yaml
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      # monitoring-local is a laptop-only chart running stock Grafana images; report, don't block.
      - name: Trivy config - monitoring-local (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered/monitoring-local.yaml
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

  # ─── promotion gate ───────────────────────────────────────────────────────

  verify-signatures:
    name: Cosign verify images
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Every image of ours that the charts deploy must be pinned by digest and signed (keyless) by a
      # workflow in one of our repositories: either the service's own pipeline or the shared
      # platform-demo-workflows release. Anything pushed by hand fails the promotion.
      - name: Verify digests and signatures
        env:
          # product-catalog-db is a temporary, hand-built image for local testing; on AWS it is replaced
          # by RDS and this entry goes away together with the chart. Do not add other images here.
          UNSIGNED_ALLOWLIST: product-catalog-db
        run: |
          images=$(grep -hE '^\s+image:' rendered/*.yaml | sed -E 's/^\s*image:\s*//; s/"//g' | sort -u | grep '^mladenovskistefan/' || true)
          [ -n "$images" ] || { echo "::error::no application images found in the rendered charts"; exit 1; }
          status=0
          for ref in $images; do
            name=${ref#mladenovskistefan/}; name=${name%%[@:]*}
            if [[ "$ref" != *@sha256:* ]]; then
              echo "::error::$ref is not pinned by digest"; status=1; continue
            fi
            if cosign verify \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 --certificate-identity-regexp '^https://github.com/(mladenovskistefan111|platform-boutique)/[a-z-]+/\.github/workflows/[a-z.-]+@.+$' \
                 "$ref" > /dev/null 2>&1; then
              echo "signed    $ref"
            elif [[ " $UNSIGNED_ALLOWLIST " == *" $name "* ]]; then
              echo "::warning::$ref has no valid signature (allow-listed: $name is a temporary local-testing image)"
            else
              echo "::error::$ref has no valid signature from our pipelines"; status=1
            fi
          done
          exit $status

  # ─── admission policies ───────────────────────────────────────────────────

  kyverno-policies:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Kyverno CLI
        run: |
          curl -fsSL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar -xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done

      # Unit tests for the policies (policies/tests), then every rendered workload and add-on of every environment is evaluated
      # against them, so a chart change that admission would refuse fails here and not at sync time.
      - name: Render environments and run the policy checks
        run: |
          python3 .github/scripts/render-envs.py rendered
          .github/scripts/policy-check.sh rendered

  # ─── repo hygiene ─────────────────────────────────────────────────────────

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2
