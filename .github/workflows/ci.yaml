name: CI

# Pull-request gate for the charts. Nothing runs on a plain push.
#
# Every job runs on every pull request (no path filter: a docs-only change is cheap and a skipped required check counts as passing) and
# `gate` waits for all of them. `gate` is the ONE required status check of the branch protection; it fails when any job failed, was
# cancelled, or was skipped without a reason it knows (a job downstream of a failed `lint-and-render` is skipped by GitHub, which a
# required check would otherwise treat as a pass). Rules: the `gate` job at the end; test: .github/scripts/test-gate.py.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  COSIGN_VERSION: v3.1.3
  KYVERNO_VERSION: v1.19.1
  KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  KUBERNETES_VERSION: 1.33.0

jobs:
  # ─── helm lint + render ───────────────────────────────────────────────────

  lint-and-render:
    name: Helm lint & render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          # Every chart except the umbrella first, then the umbrella (it packages the others).
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done
          helm dependency build platform-demo

      - name: helm lint
        run: |
          status=0
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            [ "$chart" = monitoring ] && continue # vendored upstream charts, not ours to lint
            args=()
            case "$chart" in
              product-catalog-db) args=(--set auth.password=x) ;;
              platform-demo) args=(--set product-catalog-db.auth.password=x) ;;
            esac
            echo "::group::helm lint $chart"
            helm lint "$chart" "${args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: helm template (every configuration we ship)
        run: |
          mkdir -p rendered
          helm template platform-demo ./platform-demo -f platform-demo/values-dev.yaml > rendered/umbrella-dev.yaml
          helm template platform-demo ./platform-demo --set product-catalog-db.auth.password=x > rendered/umbrella-default.yaml
          helm template platform-demo ./platform-demo -f platform-demo/values-prod.yaml \
            --set product-catalog-db.auth.existingSecret=s > rendered/umbrella-prod.yaml
          helm template platform-gateway ./platform-gateway > rendered/gateway.yaml
          # Not an environment add-on (its own Argo CD Application, project `secrets`): rendered here so kubeconform checks the ExternalSecrets.
          helm template external-secrets-config ./external-secrets-config > rendered/external-secrets-config.yaml
          # Every workload and add-on of every environment, rendered the way the ApplicationSets do (plus the layers'
          # single-chart Applications: cluster-bootstrap, platform-network-policies). Fails when an app's namespace is undeclared.
          python3 .github/scripts/render-envs.py rendered
          wc -l rendered/*.yaml

      # The app dropdowns of the Promote and Rollback workflows list the workloads that have an image; a new service must be added there.
      # The promotion chain (dev -> promote-stage -> promote-prod, nothing on envs/prod) is checked statically.
      - name: Check the dispatch dropdowns and the promotion chain
        run: |
          python3 .github/scripts/check-dispatch-apps.py
          python3 .github/scripts/check-promotion-chain.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered
          path: rendered/
          retention-days: 7

  # ─── schema validation ────────────────────────────────────────────────────

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Validate rendered manifests against the Kubernetes and CRD schemas
        run: |
          ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml gitops/apps/*.yaml gitops/bootstrap/*.yaml gitops/layers/*/*.yaml

  # ─── misconfiguration scan ────────────────────────────────────────────────

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      # The charts that deploy must be clean (HIGH/CRITICAL fail the build). Accepted findings, each with its reason:
      # .trivyignore.yaml.
      - name: Trivy config - application and gateway charts
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  # ─── promotion gate ───────────────────────────────────────────────────────

  verify-signatures:
    name: Cosign verify images
    runs-on: ubuntu-latest
    needs: [lint-and-render]
    timeout-minutes: 20 # 5 tries with backoff per image in the worst case (a registry outage)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The retry and classification logic is tested with a fake cosign (no network).
      - name: Self-test of the verification script and of the signer list
        run: |
          .github/scripts/test-verify-signatures.sh
          python3 .github/scripts/signer-identities.py test

      # Hosted runners share IP addresses, so anonymous Docker Hub lookups hit the pull limit. The token is READ-ONLY. Fork and Dependabot
      # pull requests get no secrets: the lookups then run anonymously (and the retries absorb most limit errors).
      - name: Log in to Docker Hub (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::no Docker Hub credentials in this run (fork or Dependabot pull request?): verifying anonymously"
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin \
            || echo "::warning::Docker Hub login failed (expired token?): verifying anonymously"

      # Every image of ours that the charts deploy must be pinned by digest and signed (keyless) by one of the workflows listed in
      # verifyImages.signers (policies/values.yaml: the same list the Kyverno policy enforces; each entry says why it exists and
      # when it can go). Anything pushed by hand fails the promotion. "No signature" is a verdict and is never retried; registry
      # errors (rate limit, 5xx, timeouts) are retried 5 times with backoff, and if they persist the job says so and fails.
      - name: Verify digests and signatures
        env:
          # product-catalog-db is a hand-built, unsigned image that stays a StatefulSet in the cluster for now (the shop moves to
          # another cluster later); this entry goes away if it is ever replaced by a signed image. Do not add other images here.
          UNSIGNED_ALLOWLIST: product-catalog-db
        run: .github/scripts/verify-signatures.sh rendered

  # ─── admission policies ───────────────────────────────────────────────────

  kyverno-policies:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    # No `needs`: it builds the dependencies and renders the environments itself and uses no artifact, so it starts at t=0.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Kyverno CLI
        run: |
          curl -fsSL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar -xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done

      # Unit tests for the policies (policies/tests), then every rendered workload and add-on of every environment is evaluated
      # against them, so a chart change that admission would refuse fails here and not at sync time.
      - name: Render environments and run the policy checks
        run: |
          python3 .github/scripts/render-envs.py rendered
          .github/scripts/policy-check.sh rendered

  # ─── promotion policy ─────────────────────────────────────────────────────

  # Which image changes a pull request may make (dev: any signed digest; stage: what dev has now or what stage had before;
  # prod: the same with stage; one environment per pull request, nothing else mixed in). Rules: .github/scripts/promotion-policy.sh.
  promotion-policy:
    name: Promotion policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # to read the labels at run time (re-run the job after adding a label)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the policy reads the history of the base branch
          persist-credentials: false

      - name: Self-test of the policy
        run: .github/scripts/test-promotion-policy.sh

      - name: Self-test of the promotion planning (promote.sh)
        run: .github/scripts/test-promote.sh

      - name: Check the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')
          export LABELS
          .github/scripts/promotion-policy.sh

  # ─── repo hygiene ─────────────────────────────────────────────────────────

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  # ─── the one required check ───────────────────────────────────────────────

  # The ONLY required status check of the branch protection (name: `gate`). Waits for every other job and runs even when they fail
  # (`always()`). A job that GitHub skipped because something upstream failed (everything behind `lint-and-render`) would count as a
  # pass for a required check; here it is the failed job that is reported, first, and the gate fails. A skip that nothing explains
  # fails too. The only legitimate skip: `Promotion policy` on a manual run (it needs a pull request).
  # Add a job to this workflow => add it to `needs` here AND to the list in the script; .github/scripts/test-gate.py fails otherwise.
  gate:
    name: gate
    needs: [lint-and-render, kubeconform, trivy-config, verify-signatures, kyverno-policies, promotion-policy, secret-scan, workflows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Self-test of the gate (all green, failed, cancelled, unexpected skip, missing job, ...)
        run: python3 .github/scripts/test-gate.py

      - name: Every job passed, or was skipped for a reason we know
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Jobs this workflow has, besides the gate. NEEDS holds the result of every one of them.
          jobs=(lint-and-render kubeconform trivy-config verify-signatures kyverno-policies promotion-policy secret-scan workflows)

          declare -A want
          for job in "${jobs[@]}"; do want[$job]=success; done
          case "$EVENT_NAME" in
            pull_request) ;;
            workflow_dispatch) want[promotion-policy]=skipped ;; # it needs a pull request to look at
            *) echo "::error::event '$EVENT_NAME' is not one this workflow is written for"; exit 1 ;;
          esac

          for job in "${jobs[@]}"; do
            jq -e --arg job "$job" 'has($job)' <<< "$NEEDS" > /dev/null || { echo "::error::job $job is missing from needs"; exit 1; }
          done

          # Failed and cancelled jobs first: they are the cause. Everything downstream of a failed job is skipped by GitHub, and
          # that skip is a consequence, not a finding, so it is not reported as one.
          mapfile -t rows < <(jq -r 'to_entries | sort_by(.value.result == "failure" or .value.result == "cancelled" | not) | .[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          failed=0
          unexplained=0
          {
            echo "### Gate ($EVENT_NAME)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            case "$result" in
              failure | cancelled)
                failed=1
                echo "::error::$job $result"
                echo "- **$job $result**" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done

          {
            echo
            echo "| job | result | expected |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            expected=${want[$job]:-"(unknown job)"}
            printf '%-18s %-10s (expected %s)\n' "$job" "$result" "$expected"
            echo "| $job | $result | $expected |" >> "$GITHUB_STEP_SUMMARY"
            # Only when nothing failed: otherwise the failure above is the cause and skipped jobs downstream of it are expected.
            if [ "$failed" = 0 ] && [ "$result" != "$expected" ]; then
              echo "::error::$job is '$result', expected '$expected'"
              unexplained=1
            fi
          done
          exit $((failed + unexplained))
