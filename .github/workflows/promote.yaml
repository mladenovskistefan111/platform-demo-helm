name: Promote

# The manual form of the promotion. Normally you do not need it: the application repository's Publish run carries an image from dev to
# stage to prod, waiting for one click per environment. Use this form to promote an app whose run was rejected or replaced, to promote
# several apps at once, or to choose the version yourself. Started by a person: Actions -> Promote -> Run workflow (branch: main).
#
#   app      one of the shop services (a dropdown) or `all` (every app whose digest differs). The list is checked against the
#            workloads by .github/scripts/check-dispatch-apps.py in CI: add a service there when you add a workload.
#   env      stage or prod
#   version  X.Y.Z. Stage: empty = computed (the next patch after the newest <app>-vX.Y.Z tag of this repository; none yet: 1.0.0),
#            or type one (a minor or major bump). It is recorded next to the digest (`# vX.Y.Z` on the image.digest line) and, after
#            the merge, becomes the tag and GitHub Release <app>-vX.Y.Z (stage-release.yaml). Prod: leave it empty, the version comes
#            from stage unchanged (if you type one it must equal the one in stage; a safeguard for the person approving).
#
# Same three steps as the automatic ones, the same script (.github/scripts/promote.sh) and the same gitops-promote workflow:
#   Plan (read-only, shows what changes) -> Approve <env> deployment (the GitHub environment of the target: stage or prod; Review
#   deployments) -> Promote <app> (one pull request per app, normal checks, auto-merge).
# The digest is read from the previous environment's file at the current main. Nothing is rebuilt and the registry is never asked for
# "the newest": what runs in stage is exactly what dev ran, and what runs in prod is exactly what stage ran.

run-name: Promote ${{ inputs.app }} to ${{ inputs.env }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to promote, or all (every app whose digest differs)
        type: choice
        options: [all, ad-service, cart-service, checkout-service, currency-service, email-service, frontend, payment-service, product-catalog-service, recommendation-service, shipping-service]
        required: true
      env:
        description: Target environment
        type: choice
        options: [stage, prod]
        required: true
      version:
        description: "Release version X.Y.Z (stage: empty = the next patch, computed; prod: empty, taken from stage)"
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  # Read-only: decides what would change and shows it, so the person approving sees a concrete list.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      items: ${{ steps.plan.outputs.items }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide what to promote
        id: plan
        env:
          MODE: manual
          APP: ${{ inputs.app }}
          TARGET_ENV: ${{ inputs.env }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/promote.sh plan

  # Waits for the reviewers of the GitHub environment of the target (stage or prod; deployment branch: main).
  approve:
    name: Approve ${{ inputs.env }} deployment
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      actions: read # who approved, for the summary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check that the approved plan is still current
        env:
          TARGET_ENV: ${{ inputs.env }}
          VERSION: ${{ inputs.version }}
          ITEMS: ${{ needs.plan.outputs.items }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/promote.sh recheck

  promote:
    name: Promote ${{ matrix.app }}
    needs: [plan, approve]
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.items) }}
    permissions: {}
    # Not pinned to a real commit yet: set it to the commit of the merged platform-demo-workflows release that adds gitops-promote.yaml.
    uses: platform-boutique/platform-demo-workflows/.github/workflows/gitops-promote.yaml@341f641320553ad73969b637ff125466e6b2d99c # v3.1.0
    with:
      app: ${{ matrix.app }}
      env: ${{ inputs.env }}
      image-tag: ${{ matrix.tag }}
      image-digest: ${{ matrix.digest }}
      source-repository: ${{ github.repository }}
      source-sha: ${{ needs.plan.outputs.sha }}
      version: ${{ matrix.version }}
    secrets:
      PROMOTE_APP_ID: ${{ secrets.PROMOTE_APP_ID }}
      PROMOTE_APP_PRIVATE_KEY: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

  # The pull requests of this run, in one table.
  result:
    name: Result
    needs: [plan, approve, promote]
    if: ${{ !cancelled() && needs.approve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: List the pull requests
        env:
          TARGET_ENV: ${{ inputs.env }}
          ITEMS: ${{ needs.plan.outputs.items }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/promote.sh result
