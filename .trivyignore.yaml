# Accepted Trivy findings of the rendered charts. Each has a written reason; everything else at HIGH or CRITICAL fails the build.
misconfigurations:
  - id: KSV-0109
    paths:
      - "**/cluster-main-dex.yaml"
    statement: >-
      False positive. Trivy matches the word `clientSecret` in Dex's ConfigMap, but the value is `$GITHUB_CLIENT_SECRET`: a reference to an
      environment variable that Dex expands at start from the Secret (secretRef in the Deployment). No secret is stored in the ConfigMap, and
      Dex has no other way to name the key.
