apiVersion: apps/v1
kind: Deployment
metadata:
  name: ad-service
  namespace: {{ .Values.namespace }}
  labels:
    app: ad-service
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: ad-service
  template:
    metadata:
      labels:
        app: ad-service
    spec:
      containers:
        - name: ad-service
          image: {{ .Values.service.image }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: ad-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.monitoring.otlpEndpoint | quote }}
            - name: PYROSCOPE_ADDR
              value: {{ .Values.monitoring.pyroscopeAddr | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
