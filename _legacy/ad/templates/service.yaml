apiVersion: v1
kind: Service
metadata:
  name: ad-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: ad-service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
