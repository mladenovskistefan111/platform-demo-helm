apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: {{ .Values.namespace }}
  labels:
    app: cart-service
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ .Values.redis.host }} {{ .Values.redis.port }}; do echo "waiting for redis"; sleep 2; done
      containers:
        - name: cart-service
          image: {{ .Values.image }}
          ports:
            - name: grpc
              containerPort: {{ .Values.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: REDIS_ADDR
              value: {{ .Values.redis.host }}:{{ .Values.redis.port }}
            - name: COLLECTOR_SERVICE_ADDR
              value: {{ .Values.monitoring.collectorAddr | quote }}
            - name: OTEL_SERVICE_NAME
              value: cart-service
          readinessProbe:
            tcpSocket:
              port: {{ .Values.grpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
