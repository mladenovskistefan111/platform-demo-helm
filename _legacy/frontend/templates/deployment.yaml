apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.service.image }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: frontend
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: {{ .Values.monitoring.collectorAddr | quote }}
            - name: ENABLE_PROFILING
              value: "1"
            - name: PYROSCOPE_ADDR
              value: {{ .Values.monitoring.pyroscopeAddr | quote }}
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: {{ .Values.dependencies.productCatalogAddr | quote }}
            - name: CURRENCY_SERVICE_ADDR
              value: {{ .Values.dependencies.currencyAddr | quote }}
            - name: CART_SERVICE_ADDR
              value: {{ .Values.dependencies.cartAddr | quote }}
            - name: RECOMMENDATION_SERVICE_ADDR
              value: {{ .Values.dependencies.recommendationAddr | quote }}
            - name: CHECKOUT_SERVICE_ADDR
              value: {{ .Values.dependencies.checkoutAddr | quote }}
            - name: SHIPPING_SERVICE_ADDR
              value: {{ .Values.dependencies.shippingAddr | quote }}
            - name: AD_SERVICE_ADDR
              value: {{ .Values.dependencies.adAddr | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
