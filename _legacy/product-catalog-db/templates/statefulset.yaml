apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-catalog-db
  namespace: {{ .Values.namespace }}
  labels:
    app: product-catalog-db
spec:
  serviceName: product-catalog-db
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog-db
  template:
    metadata:
      labels:
        app: product-catalog-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
          envFrom:
            - secretRef:
                name: product-catalog-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.user }} -d {{ .Values.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.user }} -d {{ .Values.database }}
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage }}
