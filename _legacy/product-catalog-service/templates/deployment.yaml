apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog-service
  namespace: {{ .Values.namespace }}
  labels:
    app: product-catalog-service
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: product-catalog-service
  template:
    metadata:
      labels:
        app: product-catalog-service
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ .Values.db.host }} {{ .Values.db.port }}; do echo "waiting for db"; sleep 2; done
      containers:
        - name: product-catalog-service
          image: {{ .Values.image }}
          ports:
            - name: grpc
              containerPort: {{ .Values.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: DATABASE_URL
              value: postgres://{{ .Values.db.user }}:{{ .Values.db.password }}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.database }}
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: {{ .Values.monitoring.collectorAddr | quote }}
            - name: ENABLE_PROFILING
              value: "1"
            - name: PYROSCOPE_ADDR
              value: {{ .Values.monitoring.pyroscopeAddr | quote }}
            - name: OTEL_SERVICE_NAME
              value: product-catalog-service
          readinessProbe:
            tcpSocket:
              port: {{ .Values.grpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
