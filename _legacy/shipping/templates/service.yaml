apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: shipping-service
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcPort }}
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
