apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum | trunc 16 | quote }}
        {{- with .Values.config.overlay }}
        checksum/overlay: {{ toYaml . | sha256sum | trunc 16 | quote }}
        {{- end }}
    spec:
      serviceAccountName: backstage
      # The Kubernetes plugin reads the cluster with this ServiceAccount's token (read-only ClusterRole in rbac.yaml).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # `nonroot` of the distroless image, which owns /app and /data
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backstage
          image: {{ include "backstage.image" .Values.images.backstage }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - node
            - packages/backend
            {{- range .Values.config.files }}
            - --config
            - {{ . }}
            {{- end }}
            {{- if .Values.config.overlay }}
            - --config
            - /etc/backstage-overlay/app-config.overlay.yaml
            {{- end }}
          envFrom:
            - configMapRef: { name: backstage-env }
          env:
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } } }
            - { name: BACKSTAGE_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: BACKSTAGE_OIDC_CLIENT_SECRET } } }
            - { name: AUTH_SESSION_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: AUTH_SESSION_SECRET } } }
            - { name: GRAFANA_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: GRAFANA_TOKEN, optional: true } } }
            - { name: GITHUB_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: GITHUB_TOKEN, optional: true } } }
          ports:
            - { name: http, containerPort: 7007 }
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.resources.backstage | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.caConfigMap }}
            - { name: ca, mountPath: /etc/platform-demo-ca, readOnly: true }
            {{- end }}
            {{- if .Values.config.overlay }}
            - { name: overlay, mountPath: /etc/backstage-overlay, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: backstage-data }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        {{- if .Values.caConfigMap }}
        - name: ca
          configMap: { name: {{ .Values.caConfigMap }} }
        {{- end }}
        {{- if .Values.config.overlay }}
        - name: overlay
          configMap: { name: backstage-config-overlay }
        {{- end }}
{{- if .Values.config.overlay }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config-overlay
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 4 }}
data:
  app-config.overlay.yaml: |
    {{- toYaml .Values.config.overlay | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 80, targetPort: http }
