apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-env
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage" "root" .) | nindent 4 }}
data:
  APP_BASE_URL: {{ printf "https://backstage.%s" .Values.domain | quote }}
  DEX_ISSUER_URL: {{ .Values.dex.issuer | quote }}
  ARGOCD_URL: {{ printf "https://argocd.%s" .Values.domain | quote }}
  GRAFANA_URL: {{ printf "https://grafana.%s" .Values.domain | quote }}
  CLUSTER_NAME: {{ .Values.clusterName | quote }}
  POSTGRES_HOST: backstage-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: backstage
  TECHDOCS_CACHE: /data
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
