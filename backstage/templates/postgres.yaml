apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backstage-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage-postgres" "root" .) | nindent 4 }}
spec:
  serviceName: backstage-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "backstage.labels" (dict "name" "backstage-postgres" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70          # `postgres` in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ include "backstage.image" .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: backstage }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, backstage, -h, 127.0.0.1] }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: { command: [pg_isready, -U, backstage, -h, 127.0.0.1] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.resources.postgres | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "backstage.labels" (dict "name" "backstage-postgres" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: backstage-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
