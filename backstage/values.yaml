# Backstage (image built from platform-demo-backstage). Install into the `backstage` namespace.
# Environment-specific values (domain, cluster name, Dex issuer, catalog layers) are set in envs/<env>/values/backstage.yaml.

domain: platform-demo.click
clusterName: platform-demo

images:
  # tag = which version, digest = what actually runs. The digest of a released image is promoted here by a pull request, like
  # every other service (platform-demo-backstage/README.md, "First release"). Empty = the tag is used as it is.
  backstage: { repository: mladenovskistefan/platform-demo-backstage, tag: 0.1.0, digest: "" }
  pullPolicy: IfNotPresent

# Which configuration layers the image loads (see platform-demo-backstage/app-config*.yaml). `app-config.github.yaml` is the
# catalog: every repository of the GitHub organisation plus its users and teams (needs GITHUB_TOKEN in the Secret).
config:
  files: [app-config.yaml, app-config.production.yaml, app-config.github.yaml]
  # Extra configuration layered last, without rebuilding the image (a map in app-config syntax, rendered into a ConfigMap).
  overlay: {}

# Secret with POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD, BACKSTAGE_OIDC_CLIENT_SECRET, AUTH_SESSION_SECRET,
# GITHUB_TOKEN and (optional) GRAFANA_TOKEN. Never in Git: External Secrets Operator creates it from AWS (external-secrets-config/,
# docs/secrets.md). Until it exists the pod stays in CreateContainerConfigError, which the kubelet retries by itself: no crash loop.
secretName: backstage-secrets

# The database is an Amazon RDS PostgreSQL instance outside the cluster; host, port, user and the (RDS-rotated) password come from
# the Secret above. The connection is always encrypted: PGSSLMODE is read by node-postgres when the app-config sets no `ssl`.
# `require` = TLS verified against the trusted CAs; the image must trust the RDS CA bundle (NODE_EXTRA_CA_CERTS, see docs/secrets.md).
database:
  sslMode: require

# ConfigMap with an extra CA (key ca.crt) for NODE_EXTRA_CA_CERTS. Empty = the image's own value (the AWS RDS bundle baked into it).
caConfigMap: ""

# Extra non-secret environment.
extraEnv: {}

dex:
  issuer: https://dex.platform-demo.click

# Set to a RuntimeClass name (e.g. gvisor) to run the pod in a sandbox. Empty = the cluster default; on AWS a Kyverno mutation
# also sets it from a namespace label, and a value here is the same thing stated explicitly.
runtimeClassName: ""

# Annotation read by stakater/reloader (gitops/apps/application-reloader.yaml): a changed Secret restarts the pod, which is how
# the RDS password rotation (every 7 days) reaches Backstage. Harmless when reloader is not installed.
reloadOnSecretChange: true

# CiliumNetworkPolicy for the pod (off by default: Cilium is the CNI on the cluster, but the namespace has no default-deny).
networkPolicy:
  enabled: false
  # RDS lives in the VPC: allowed on 5432 only.
  rdsCidr: 10.0.0.0/16
  rdsPort: 5432
  # Further CiliumNetworkPolicy egress rules (raw objects), e.g. Grafana if it is deployed.
  extraEgress: []

persistence:
  # Published TechDocs sites. The cluster's default StorageClass is used when empty.
  size: 1Gi
  storageClass: ""

resources:
  backstage: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
