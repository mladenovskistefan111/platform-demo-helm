apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform-demo-helm
  title: platform-demo-helm
  description: "Helm charts, per-environment values, Argo CD configuration, Kyverno policies and the local kind cluster."
  annotations:
    github.com/project-slug: platform-boutique/platform-demo-helm
    backstage.io/source-location: url:https://github.com/platform-boutique/platform-demo-helm/tree/main/
    backstage.io/techdocs-ref: dir:.
    argocd/app-selector: app.kubernetes.io/part-of=platform-demo
    backstage.io/kubernetes-namespace: argocd
  tags: [helm, gitops, kyverno]
  links:
    - { url: "https://github.com/platform-boutique/platform-demo-helm", title: "Repository", icon: github }
    - { url: "https://argocd.platform-demo.test", title: "Argo CD", icon: dashboard }
spec:
  type: deployment-config
  lifecycle: experimental
  owner: group:default/maintainers
  system: delivery
  dependsOn:
    - component:default/platform-demo-workflows
    - resource:default/argocd
    - resource:default/kyverno
