{{- if eq .Values.storage.type "kubernetes" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dex.labels" . | nindent 4 }}
---
# Dex's own state: auth requests, codes, refresh tokens, keys... as custom resources of group dex.coreos.com in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dex.labels" . | nindent 4 }}
rules:
  - apiGroups: [dex.coreos.com]
    resources: [authcodes, authrequests, connectors, devicerequests, devicetokens, oauth2clients, offlinesessionses, passwords, refreshtokens, signingkeies]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
  labels: {{- include "dex.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dex }
subjects:
  - { kind: ServiceAccount, name: dex, namespace: {{ .Release.Namespace }} }
---
# Dex registers its CRDs on startup (create only, nothing else cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dex-{{ .Release.Namespace }}-crds
  labels: {{- include "dex.labels" . | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex-{{ .Release.Namespace }}-crds
  labels: {{- include "dex.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dex-{{ .Release.Namespace }}-crds }
subjects:
  - { kind: ServiceAccount, name: dex, namespace: {{ .Release.Namespace }} }
{{- end }}
