# dev = the EKS cluster (GitOps). The catalog is read from GitHub (app-config.github.yaml, needs GITHUB_TOKEN in the Secret).
domain: platform-demo.click
clusterName: platform-demo
config:
  files: [app-config.yaml, app-config.production.yaml, app-config.github.yaml]
images:
  # First release: tag v0.1.0 of platform-demo-backstage, then a pull request sets the released digest here (like every service).
  backstage: { repository: mladenovskistefan/platform-demo-backstage, tag: 0.1.0, digest: "" }
