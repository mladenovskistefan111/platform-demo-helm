# Namespaces of the dev cluster and their labels (see cluster-bootstrap/values.yaml for the meaning of each field).
# This is the ONE place that decides Pod Security, the Kyverno workload profile and the gVisor sandbox per namespace.
#
# gVisor (sandbox: true) is on where the pods are ordinary application pods, off where it cannot or should not be:
#   platform-demo   YES  the shop; includes the PostgreSQL StatefulSet (EBS volume) and Redis - see gitops/README.md "gVisor" for the risks
#   backstage, sso  YES  Node.js portal and Dex: plain TCP clients/servers, no host access
#   argocd          NO   the repo-server forks helm/git/kustomize (syscall-heavy, slow in a user-space kernel) and Argo CD is the way to recover everything else
#   kyverno         NO   admission webhooks run on the host network (EKS control plane cannot reach pod IPs over the overlay); host-network pods cannot be sandboxed
#   external-secrets NO  its webhook runs on the host network for the same reason
#   reloader        NO   cluster-wide controller; keep the secret-rotation path simple (switch on once the sandbox has proven itself)
#   gateway-system  NO   no pods (the Gateway runs in cilium-envoy on the host network, in kube-system)
# kube-system and cilium-spire are not listed: they belong to Terraform/Cilium and use host networking, privileged pods and hostPath.
namespaces:
  # created by Terraform, adopted here
  - { name: argocd, podSecurity: baseline, sandbox: false }
  - { name: external-secrets, podSecurity: privileged, sandbox: false }   # Terraform labels it baseline; the webhook runs with hostNetwork, which baseline forbids
  # security layer
  - { name: kyverno, sandbox: false }              # admission controller with hostNetwork
  - { name: reloader, podSecurity: baseline, sandbox: false }
  # platform layer
  - { name: gateway-system, podSecurity: baseline, sandbox: false }
  - { name: sso, podSecurity: baseline, sandbox: true }
  - { name: backstage, podSecurity: baseline, sandbox: true }
  # workloads layer (the shop)
  - { name: platform-demo, podSecurity: restricted, profile: workload, sandbox: true }
