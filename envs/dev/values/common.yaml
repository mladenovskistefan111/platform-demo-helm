# Applied to every workload in this environment.
global:
  networkPolicy:
    type: cilium        # CiliumNetworkPolicy with SPIFFE/SPIRE mutual authentication (see platform-common)

# Small profile (same as platform-demo/values-dev.yaml): one replica, no HPA/PDB/spread. Revisit for EKS (metrics-server, node count).
replicaCount: 1
autoscaling: { enabled: false }
podDisruptionBudget: { enabled: false }
topologySpread: { enabled: false }
preStopSleepSeconds: 0
