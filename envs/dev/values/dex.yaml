# dev = the AWS cluster. The only way in is GitHub: create the OAuth App of the organisation (callback
# https://dex.platform-demo.click/callback) and type its id and secret into Parameter Store (/platform-demo/github-oauth/*,
# see docs/secrets.md in the infra repository); External Secrets turns them into the Secret `sso/dex-secrets`. There are no local passwords.
domain: platform-demo.click
issuer: https://dex.platform-demo.click
github:
  enabled: true
