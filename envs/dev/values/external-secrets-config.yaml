# dev = the AWS (EKS) environment. Everything has a default in the chart except the Secrets Manager secret that RDS created for the
# master user of platform-demo-backstage (its name contains a random id, so it cannot be written in advance).
region: us-east-1
rds:
  # TODO(integrator): set to the ARN of the managed master secret, from Terraform (output) or
  #   aws rds describe-db-instances --db-instance-identifier platform-demo-backstage --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text
  # An ARN is an identifier, not a secret. Until then backstage-secrets stays unsynced (SecretSyncedError on POSTGRES_PASSWORD).
  masterSecretId: "rds!db-REPLACE-WITH-THE-SECRET-OF-platform-demo-backstage"
