# dev = the AWS cluster. The workload profile (platform-demo) is ENFORCED; the platform profile (argocd, backstage, sso) only reports.
# Per-policy overrides go under `actions`, e.g. { pod-identity: Audit } to demote one while investigating.
defaultAction: Deny
enforcePlatform: false
domain: platform-demo.click

# Signature verification (pd-verify-images) is enforced: it reads manifests from Docker Hub with the read-only token that External
# Secrets creates as kyverno/dockerhub-read (verifyImages.pullSecret in the chart defaults), so the anonymous rate limit is not an issue.
# If a lookup misbehaves on the first deploy, demote just this policy while you debug:  actions: { verify-images: Audit }
actions: {}
