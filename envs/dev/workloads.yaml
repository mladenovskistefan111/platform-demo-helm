# The shop in the DEV environment (namespace dev-platform-demo). One line = one Argo CD Application
# named dev-<app>. chart = directory at the repository root and must equal <app>; the namespace must be declared in
# ../../clusters/main/values/cluster-bootstrap.yaml (CI checks that and the rest of the wiring, see docs/environments.md).
# Optional per-entry field:  cluster: <name of a cluster registered in Argo CD>  (default in-cluster) - the hook for moving the shop to
# its own cluster: register it, then put `cluster:` on every line.
# The whole environment is switched off by replacing this list with `[]`.
- { app: product-catalog-db,       chart: product-catalog-db,       namespace: dev-platform-demo }
- { app: cart-redis,               chart: cart-redis,               namespace: dev-platform-demo }
- { app: product-catalog-service,  chart: product-catalog-service,  namespace: dev-platform-demo }
- { app: cart-service,             chart: cart-service,             namespace: dev-platform-demo }
- { app: currency-service,         chart: currency-service,         namespace: dev-platform-demo }
- { app: shipping-service,         chart: shipping-service,         namespace: dev-platform-demo }
- { app: payment-service,          chart: payment-service,          namespace: dev-platform-demo }
- { app: email-service,            chart: email-service,            namespace: dev-platform-demo }
- { app: recommendation-service,   chart: recommendation-service,   namespace: dev-platform-demo }
- { app: ad-service,               chart: ad-service,               namespace: dev-platform-demo }
- { app: checkout-service,         chart: checkout-service,         namespace: dev-platform-demo }
- { app: frontend,                 chart: frontend,                 namespace: dev-platform-demo }
