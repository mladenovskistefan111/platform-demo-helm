# Sizing of the STAGE shop (applied to every app of the environment, before values/<app>.yaml). Small profile, same as
# platform-demo/values-dev.yaml: one replica, no HPA/PDB/spread (two Spot nodes, one namespace quota). Non-prod stays at one replica.
replicaCount: 1
autoscaling: { enabled: false }
podDisruptionBudget: { enabled: false }
topologySpread: { enabled: false }
preStopSleepSeconds: 0
