{{- if .Values.kyverno.dockerhubReadEnabled }}
# kyverno/dockerhub-read: a read-only Docker Hub login for Kyverno's image-signature verification (anonymous pulls are rate limited).
# The two parameters are assembled into a kubernetes.io/dockerconfigjson by the operator's template engine.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.kyverno.dockerhubSecretName }}
  namespace: {{ .Values.kyverno.namespace }}
  labels: {{- include "esc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  target:
    name: {{ .Values.kyverno.dockerhubSecretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":{{ `{{ .username | toJson }}` }},"password":{{ `{{ .token | toJson }}` }},"auth":{{ `{{ printf "%s:%s" .username .token | b64enc | toJson }}` }}}}}'
  data:
    {{- include "esc.ssm" (dict "root" . "key" "username" "path" "dockerhub/username") | nindent 4 }}
    {{- include "esc.ssm" (dict "root" . "key" "token" "path" "dockerhub/token") | nindent 4 }}
{{- end }}
