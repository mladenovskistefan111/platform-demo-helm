# frontend - Frontend - HTTP storefront (Go)
# Defaults are production-leaning (HA, hardened, NetworkPolicy on). See ../platform-demo/values-dev.yaml for a lightweight profile.

nameOverride: ""
fullnameOverride: ""
component: frontend

# Shared with the umbrella chart (parent values override these).
global:
  imageRegistry: ""            # e.g. registry.example.com/mirror - prefixes every image
  monitoring:
    namespace: monitoring      # namespace of the observability stack (NetworkPolicy egress)
    otlpEndpoint: http://alloy.monitoring.svc.cluster.local:4317   # OTLP/gRPC: traces, metrics, logs
    pyroscopeAddr: http://alloy.monitoring.svc.cluster.local:4040  # profiles (Pyroscope push protocol, via Alloy)

image:
  registry: ""
  repository: mladenovskistefan/frontend
  tag: ""                       # defaults to Chart.appVersion (build/push this tag, or set digest)
  digest: "sha256:fc6b03353a8a99360aaff5e2c6c7293b6e5e28876a4091c2b4d9adb111b5c849"                  # mladenovskistefan/frontend:latest, OTLP build (2026-10)
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
revisionHistoryLimit: 3
minReadySeconds: 5
progressDeadlineSeconds: 300
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0   # never drop capacity during a rollout
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5   # lets endpoints drain before SIGTERM

serviceAccount:
  create: true
  name: ""
  automount: false   # no API token in the pod
  annotations: {}

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

service:
  type: ClusterIP
  annotations: {}
  ports:
    - name: http
      port: 80
      targetPort: http

# Telemetry: OTLP/gRPC for traces+metrics+logs, Pyroscope push for profiles - both go to Alloy.
telemetry:
  k8sResourceAttributes: true   # adds k8s.pod.name / namespace / node via OTEL_RESOURCE_ATTRIBUTES

# Plain environment. String values go through `tpl`, so {{ .Values... }} and $(VAR) work.
env:
  OTEL_SERVICE_NAME: "frontend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.global.monitoring.otlpEndpoint }}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  SERVICE_VERSION: "{{ .Chart.AppVersion }}"
  PORT: "8080"
  ENABLE_PROFILING: "1"
  PYROSCOPE_ADDR: "{{ .Values.global.monitoring.pyroscopeAddr }}"
  PRODUCT_CATALOG_SERVICE_ADDR: "product-catalog-service:3550"
  CURRENCY_SERVICE_ADDR: "currency-service:7000"
  CART_SERVICE_ADDR: "cart-service:7070"
  RECOMMENDATION_SERVICE_ADDR: "recommendation-service:8080"
  CHECKOUT_SERVICE_ADDR: "checkout-service:5050"
  SHIPPING_SERVICE_ADDR: "shipping-service:50051"
  AD_SERVICE_ADDR: "ad-service:9555"

secretEnv: []
extraEnv: []
envFrom: []

initContainers: []

startupProbe:
  httpGet:
    path: "/_healthz"
    port: "http"
  periodSeconds: 2
  failureThreshold: 15
readinessProbe:
  httpGet:
    path: "/_healthz"
    port: "http"
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: "/_healthz"
    port: "http"
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 48Mi
  limits:
    cpu: "500m"
    memory: 192Mi

# Pod/container hardening (restricted Pod Security Standard).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Writable scratch space for a read-only root filesystem.
tmpVolume:
  enabled: false
  mountPath: /tmp
  sizeLimit: 64Mi
volumes: []
volumeMounts: []

# Horizontal Pod Autoscaler (needs metrics-server). Target is a % of the CPU *request*.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30

# Keeps at least one pod serving during voluntary disruptions (node drains, upgrades).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  # minAvailable: 1

# Spread replicas over zones and nodes (soft: never blocks scheduling on small clusters).
topologySpread:
  enabled: true
  constraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

# Zero-trust networking: only the listed callers may connect, only the listed dependencies may be reached.
networkPolicy:
  enabled: true
  ingress:
    from: []          # service names in this namespace
    fromNamespaces: [ingress-nginx]   # namespace of your ingress controller
    fromCIDRs: []
    extra: []
  egress:
    enabled: true
    dns: true
    monitoring: true
    monitoringPorts: [4317, 4040]   # Alloy: OTLP/gRPC, Pyroscope
    to:
      - { name: product-catalog-service, port: 3550 }
      - { name: currency-service, port: 7000 }
      - { name: cart-service, port: 7070 }
      - { name: recommendation-service, port: 8080 }
      - { name: checkout-service, port: 5050 }
      - { name: shipping-service, port: 50051 }
      - { name: ad-service, port: 9555 }
    extra: []

# The only externally exposed service. Use TLS: the session cookies are `Secure` and are dropped over plain HTTP.
ingress:
  enabled: false
  className: ""                # e.g. nginx
  annotations: {}
  servicePortName: http
  hosts:
    - host: shop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: shop-tls
  #    hosts: [shop.example.com]

podAnnotations: {}
podLabels: {}
annotations: {}
commonLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
