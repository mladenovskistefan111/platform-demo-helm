# The ClusterSecretStores (SSM Parameter Store, Secrets Manager) and the ExternalSecrets of Backstage, Dex, Argo CD and Kyverno
# (chart `external-secrets-config/`). Needs, in this order:
#   1. application-external-secrets   the CRDs and the operator (retry + SkipDryRunOnMissingResource cover the first sync)
#   2. the namespaces backstage, sso, kyverno, argocd   (created by their own Applications; a missing namespace is retried)
# Inside the chart the stores are sync-wave 0 and the ExternalSecrets wave 1. The target workloads need no ordering: a pod whose
# Secret does not exist yet waits in CreateContainerConfigError and the kubelet retries it by itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-external-secrets-config
  namespace: argocd
  labels:
    platform.demo/env: dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: secrets
  source:
    repoURL: https://github.com/platform-boutique/platform-demo-helm.git
    targetRevision: main
    path: external-secrets-config
    helm:
      releaseName: external-secrets-config
      ignoreMissingValueFiles: true
      valueFiles:
        - ../envs/dev/values/external-secrets-config.yaml
  # The stores are cluster-scoped; the ExternalSecrets name their own namespaces.
  destination: { name: in-cluster, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 15
      backoff: { duration: 15s, factor: 2, maxDuration: 10m }
