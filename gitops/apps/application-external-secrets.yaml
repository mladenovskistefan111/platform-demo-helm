# External Secrets Operator: reads AWS SSM Parameter Store and Secrets Manager and creates Kubernetes Secrets. Chart pinned to an
# exact version (2.11.0, released 2026-09-21). Namespace and ServiceAccount are created by Terraform (the ServiceAccount carries the
# IAM role annotation, IRSA), so the chart must not create it and this Application must not manage the namespace.
#
# Order (App of Apps sync waves): this Application first, then application-external-secrets-config (its stores need the CRDs),
# which must come after the add-ons that create the target namespaces (backstage, sso, kyverno) and Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: secrets
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 1
        # Created by Terraform with eks.amazonaws.com/role-arn; the ClusterSecretStores sign in with this ServiceAccount's token.
        serviceAccount:
          create: false
          name: external-secrets
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 192Mi }
        # The chart's defaults are already `restricted` (non-root, read-only root filesystem, no capabilities, RuntimeDefault seccomp);
        # stated here so a chart upgrade cannot loosen them silently.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile: { type: RuntimeDefault }
        # No Prometheus operator on the cluster: no ServiceMonitor, no metrics Service.
        serviceMonitor: { enabled: false }
        metrics: { service: { enabled: false } }
        # Validating webhook (rejects malformed stores/ExternalSecrets) and the controller that keeps its certificate fresh.
        webhook:
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
        certController:
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
  destination: { name: in-cluster, namespace: external-secrets }
  # The cert controller writes the CA bundle into the webhook configuration at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideApply: the CRDs are larger than the annotation limit of client-side apply.
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 6
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
