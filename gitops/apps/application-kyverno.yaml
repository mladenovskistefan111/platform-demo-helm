# Kyverno itself: chart from the Kyverno Helm repo (pinned), values from this repository.
# The policies Application (application-policies.yaml) needs the CRDs this one installs and retries until they exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: security
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/gitops/kyverno/values.yaml
    - repoURL: https://github.com/platform-boutique/platform-demo-helm.git
      targetRevision: main
      ref: values
  destination: { name: in-cluster, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 6
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
