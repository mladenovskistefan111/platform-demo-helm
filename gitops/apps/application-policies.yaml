# The cluster policies (chart `policies/`, values per environment). Argo CD retries until the Kyverno CRDs exist;
# SkipDryRunOnMissingResource lets the first sync pass before Kyverno has registered its kinds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-policies
  namespace: argocd
  labels:
    platform.demo/env: dev
    platform.demo/kind: policies
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: security
  source:
    repoURL: https://github.com/mladenovskistefan111/platform-demo-helm.git
    targetRevision: main
    path: policies
    helm:
      releaseName: policies
      valueFiles:
        - ../envs/dev/values/policies.yaml
  destination: { name: in-cluster, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 8
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
