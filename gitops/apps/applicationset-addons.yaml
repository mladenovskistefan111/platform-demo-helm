# Platform add-ons per environment: the Gateway + routes and the (local) monitoring stack.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mladenovskistefan111/platform-demo-helm.git
        revision: feat/kyverno
        requeueAfterSeconds: 120
        files:
          - path: "envs/*/addons.yaml"
        values:
          env: '{{ index .path.segments 1 }}'
  template:
    metadata:
      name: '{{ .values.env }}-{{ .app }}'
      labels:
        app.kubernetes.io/part-of: platform-demo
        platform.demo/env: '{{ .values.env }}'
        platform.demo/kind: addon
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: platform
      source:
        repoURL: https://github.com/mladenovskistefan111/platform-demo-helm.git
        targetRevision: feat/kyverno
        path: '{{ .chart }}'
        helm:
          releaseName: '{{ .app }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../envs/{{ .values.env }}/values/{{ .app }}.yaml'
      destination: { name: in-cluster, namespace: '{{ .namespace }}' }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        # Third-party stacks: no privileged pods, and anything that would not pass `restricted` is called out (Kyverno
        # reports the namespace; see policies/README.md).
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/warn: restricted
        retry:
          limit: 6
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
