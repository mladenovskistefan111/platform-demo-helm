# One Application per (environment, workload). Adding an environment = adding envs/<name>/; adding a workload = one line in
# envs/<name>/workloads.yaml. Promotion = a PR that changes image.digest in envs/<name>/values/<app>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mladenovskistefan111/platform-demo-helm.git
        revision: main
        requeueAfterSeconds: 120
        files:
          - path: "envs/*/workloads.yaml"
        values:
          env: '{{ index .path.segments 1 }}'
  template:
    metadata:
      name: '{{ .values.env }}-{{ .app }}'
      labels:
        app.kubernetes.io/part-of: platform-demo
        platform.demo/env: '{{ .values.env }}'
        platform.demo/kind: workload
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: platform
      source:
        repoURL: https://github.com/mladenovskistefan111/platform-demo-helm.git
        targetRevision: main
        path: '{{ .chart }}'
        helm:
          releaseName: '{{ .app }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - '../envs/{{ .values.env }}/values/common.yaml'
            - '../envs/{{ .values.env }}/values/{{ .app }}.yaml'
      destination: { name: in-cluster, namespace: '{{ .namespace }}' }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
        retry:
          limit: 6
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
