# Adopted from gitops/bootstrap/root.yaml (which Terraform mirrors in its root chart) so that changes to it are reviewed like everything else.
# KEEP THIS SPEC IDENTICAL to the AppProject in gitops/bootstrap/root.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-admin
  namespace: argocd
spec:
  description: "Argo CD itself and the GitOps definitions (projects, ApplicationSets). Cluster-admin by design, keep it small."
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
    - https://argoproj.github.io/argo-helm
  destinations:
    - { name: in-cluster, namespace: argocd }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
