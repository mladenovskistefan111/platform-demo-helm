apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Platform add-ons (Gateway and routes, Dex, Backstage) and the network policy of the platform namespaces. Namespaces are NOT created here (layer bootstrap does that).
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
  destinations:
    - { name: in-cluster, namespace: gateway-system }
    - { name: in-cluster, namespace: sso }
    - { name: in-cluster, namespace: backstage }
    # HTTPRoutes and network policy live next to the services they belong to
    - { name: in-cluster, namespace: argocd }
    - { name: in-cluster, namespace: kube-system }       # route to Hubble UI
    - { name: in-cluster, namespace: platform-demo }     # routes to the shop's frontend, one per environment namespace
    - { name: in-cluster, namespace: stage-platform-demo }
    - { name: in-cluster, namespace: dev-platform-demo }
  clusterResourceWhitelist:
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
  # An add-on must not rewrite the guardrails Kyverno generates or the namespace's quota.
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
