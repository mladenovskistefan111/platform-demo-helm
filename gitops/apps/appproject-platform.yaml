apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Application workloads and the add-ons they need (gateway routes, monitoring). Namespaced resources only.
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
  destinations:
    - { name: in-cluster, namespace: platform-demo }
    - { name: in-cluster, namespace: monitoring }
    - { name: in-cluster, namespace: gateway-system }
    # HTTPRoutes for Argo CD and Hubble live next to those services
    - { name: in-cluster, namespace: argocd }
    - { name: in-cluster, namespace: kube-system }
    # the developer portal and the single sign-on provider (add-ons dex and backstage)
    - { name: in-cluster, namespace: backstage }
    - { name: in-cluster, namespace: sso }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
