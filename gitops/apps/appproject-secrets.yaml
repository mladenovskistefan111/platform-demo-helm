# External Secrets Operator (+ its configuration: ClusterSecretStore and ExternalSecrets) and Reloader.
# The ExternalSecrets live in the namespaces of the apps that consume them, hence the destination list. Nothing here can create workloads
# other than the two operators.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: External Secrets Operator, its stores/ExternalSecrets, and Reloader. Cluster-scoped by design (CRDs, webhooks).
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
    - https://charts.external-secrets.io
    - https://stakater.github.io/stakater-charts
  destinations:
    - { name: in-cluster, namespace: external-secrets }
    - { name: in-cluster, namespace: reloader }
    # ExternalSecrets, next to the consumers of the Secrets they create
    - { name: in-cluster, namespace: kyverno }
    - { name: in-cluster, namespace: sso }
    - { name: in-cluster, namespace: backstage }
    - { name: in-cluster, namespace: argocd }
    - { name: in-cluster, namespace: platform-demo }          # the shop's database credentials, one per environment namespace
    - { name: in-cluster, namespace: stage-platform-demo }
    - { name: in-cluster, namespace: dev-platform-demo }
  clusterResourceWhitelist:
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: external-secrets.io, kind: "*" }
    - { group: generators.external-secrets.io, kind: "*" }
