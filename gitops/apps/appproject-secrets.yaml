# External Secrets Operator, Reloader and the stores/ExternalSecrets of this platform. Separate from `security` and `platform` on
# purpose: the operator installs CRDs and cluster roles, and the configuration creates Secrets in several namespaces, so the
# sources, destinations and cluster-scoped kinds are listed explicitly.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets
  namespace: argocd
spec:
  description: External Secrets Operator (AWS SSM / Secrets Manager to Kubernetes Secrets) and Reloader. Cluster-scoped by design; sources are this repo and the two charts only.
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
    - https://charts.external-secrets.io
    - https://stakater.github.io/stakater-charts
  destinations:
    # operators (external-secrets is created by Terraform together with the IRSA-annotated ServiceAccount)
    - { name: in-cluster, namespace: external-secrets }
    - { name: in-cluster, namespace: reloader }
    # namespaces that receive Secrets (external-secrets-config) or are watched by Reloader (backstage, sso: Roles for the restart permission)
    - { name: in-cluster, namespace: backstage }
    - { name: in-cluster, namespace: sso }
    - { name: in-cluster, namespace: argocd }
    - { name: in-cluster, namespace: kyverno }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: external-secrets.io, kind: ClusterSecretStore }
