apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The shop, all environments (envs/<env>/workloads.yaml). One namespace per environment, namespaced resources only, no quota or limit changes. CI checks that every workloads.yaml names only the destinations listed here.
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
  destinations:
    - { name: in-cluster, namespace: platform-demo }         # prod
    - { name: in-cluster, namespace: stage-platform-demo }
    - { name: in-cluster, namespace: dev-platform-demo }
    # A second cluster for the shop: register it in Argo CD, then add its namespaces, e.g.
    #   - { name: <cluster>, namespace: platform-demo }
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
