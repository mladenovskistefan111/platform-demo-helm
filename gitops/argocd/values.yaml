# Argo CD (chart argo/argo-cd 10.10.0, the version Terraform installs). Terraform installs it once with a few bootstrap values (it cannot
# read this file); from then on gitops/layers/platform/application-argocd.yaml makes Argo CD manage and upgrade itself from here.
# Terraform must set the same `server.insecure` (below), or argocd.platform-demo.click redirects in a loop until this file is synced.
global:
  domain: argocd.platform-demo.click

configs:
  params:
    # TLS terminates at the ALB (Terraform); the Cilium Gateway forwards plain HTTP (port 80 of argocd-server). In-cluster traffic is
    # encrypted by Cilium (WireGuard). The Gateway sets X-Forwarded-Proto: https on the route, so redirects and cookies are https.
    server.insecure: true
    # Compare against what the API server would produce (dry-run apply) instead of a client-side diff; otherwise
    # Gateway API routes and StatefulSets, whose fields the API server defaults, stay OutOfSync forever.
    controller.diff.server.side: true
  cm:
    url: https://argocd.platform-demo.click
    # Poll Git every 2 minutes (default 3). A webhook from GitHub could replace this, but the ALB only admits the maintainer's address.
    timeout.reconciliation: 120s
    # Single sign-on through Dex (platform-demo-helm/dex), the same provider as Backstage. People sign in with GitHub; their teams
    # arrive as groups. The client secret is the Secret `argocd-oidc` (key clientSecret, label app.kubernetes.io/part-of=argocd) in the
    # argocd namespace, created by External Secrets from Parameter Store, never in Git. Dex is reached at its public URL (ACM certificate,
    # trusted by the system roots): from the pod that is NAT gateway -> ALB, so the ALB must admit the NAT gateways' addresses.
    oidc.config: |
      name: Dex
      issuer: https://dex.platform-demo.click
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: [openid, profile, email, groups]
      # The portal's Deployments tab sends the signed-in person's Dex ID token (issued to the client `backstage`) to this API, so Argo CD
      # applies its RBAC to that person. Without the second audience Argo CD refuses the token.
      allowedAudiences: [argocd, backstage]
    # No local accounts at all: nobody has a password in Argo CD. The built-in `admin` is switched off, so the only way in is GitHub
    # through Dex. Break-glass if Dex is unreachable: `argocd --core ...` with cluster-admin IAM (talks to the cluster directly), or
    # re-enable admin by editing this ConfigMap with kubectl.
    admin.enabled: "false"
  rbac:
    policy.default: role:readonly   # everyone who is signed in can look, not change
    scopes: "[groups]"
    policy.csv: |
      # Members of the maintainers team administer Argo CD.
      g, platform-boutique:maintainers, role:admin

# Single sign-on is handled by the standalone Dex (chart `dex`), not by the Dex bundled with Argo CD; no notification channels.
dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
  # No liveness probe on purpose (upstream removed it: restarting an overloaded controller makes it worse); the readiness probe
  # is on. Kyverno's pd-require-probes-platform knows this deviation (policies/values.yaml, `exceptions`).
server:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
repoServer:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
applicationSet:
  resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
  readinessProbe: { enabled: true }
  livenessProbe: { enabled: true }
redisSecretInit:
  resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
redis:
  resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 128Mi } }
  readinessProbe: { enabled: true }
  livenessProbe: { enabled: true }
