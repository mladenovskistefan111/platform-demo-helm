# The ONLY two objects that exist besides Argo CD after `terraform apply`. Terraform creates them from a local chart that mirrors this
# file; KEEP THE TWO COPIES IDENTICAL (spec of the AppProject and of the Application). Everything else is created from Git:
# the root Application syncs gitops/apps (AppProjects + one Application per layer), each layer syncs gitops/layers/<layer>.
# To apply by hand instead:  kubectl apply -f gitops/bootstrap/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-admin
  namespace: argocd
spec:
  description: "Argo CD itself and the GitOps definitions (projects, ApplicationSets). Cluster-admin by design, keep it small."
  sourceRepos:
    - https://github.com/platform-boutique/platform-demo-helm.git
    - https://argoproj.github.io/argo-helm
  destinations:
    - { name: in-cluster, namespace: argocd }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform-admin
  source:
    repoURL: https://github.com/platform-boutique/platform-demo-helm.git
    targetRevision: main
    path: gitops/apps
  destination: { name: in-cluster, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
