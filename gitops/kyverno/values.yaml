# Kyverno 1.19 (chart kyverno/kyverno 3.9.1). Used by gitops/layers/security/application-kyverno.yaml.
# EKS profile: two admission replicas (one per node, PDB), one of the other controllers, small requests.

# Only the admission, background and reports controllers are needed. Cleanup policies are not used yet.
cleanupController:
  enabled: false

admissionController:
  replicas: 2
  # The cluster network is an overlay (Cilium VXLAN): pod IPs are not routable in the VPC, so the EKS control plane cannot call a webhook
  # served by a normal pod. The admission controller therefore listens on the NODE's network, on 9443, a port the node security group
  # opens from the control plane (4443, 6443, 8443, 9443 and 10250 are). Two replicas need two different nodes (same host port), which
  # the scheduler enforces; the chart's PDB is on for replicas > 1. Its namespace must not enforce Pod Security (host network).
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  webhookServer:
    port: 9443
  container:
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 384Mi }
  initContainer:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  rbac:
    clusterRole:
      # The namespace baseline (GeneratingPolicy) creates a default-deny CiliumNetworkPolicy per workload namespace.
      extraResources:
        - apiGroups: [cilium.io]
          resources: [ciliumnetworkpolicies]
          verbs: [get, list, watch, create, update, patch, delete]
reportsController:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  rbac:
    clusterRole:
      # Background scans read the kinds our guardrail policies validate.
      extraResources:
        - apiGroups: [gateway.networking.k8s.io]
          resources: [gateways, httproutes]
          verbs: [get, list, watch]
        - apiGroups: [cilium.io]
          resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
          verbs: [get, list, watch]

features:
  # PolicyExceptions are honoured only when created in the kyverno namespace (i.e. by whoever administers Kyverno),
  # never from the workload namespaces they would exempt.
  policyExceptions:
    enabled: true
    namespace: kyverno
  # Kyverno writes success events for every request otherwise; keep the event stream quiet.
  omitEvents:
    eventTypes: [PolicyApplied, PolicySkipped]

config:
  # Namespaces whose objects never reach Kyverno. These run the CNI and SPIRE: a Kyverno outage must not stop them
  # (webhook deadlock), and they are not ours to police. argocd, backstage and sso are policed (report only), the shop namespaces (platform-demo, stage-platform-demo, dev-platform-demo) enforced.
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, cilium-spire, cilium-secrets, kyverno]
