# Cilium for the local kind cluster (chart cilium/cilium 1.20.2).
image:
  pullPolicy: IfNotPresent
ipam:
  mode: kubernetes

# kube-proxy-free: the API server is reached through the control-plane container, not a Service VIP.
kubeProxyReplacement: true
k8sServiceHost: platform-local-control-plane
k8sServicePort: 6443

# Gateway API served by Cilium (replaces Envoy Gateway). No LoadBalancer on kind -> listeners on the host network.
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# Mutual authentication (SPIFFE/SPIRE). Beta in Cilium. The SPIRE server keeps its CA on a 1Gi PVC (kind's default
# StorageClass), so restarting it does not change the trust domain's CA and does not disturb running workloads.
authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        server:
          # The SPIRE 1.15 image defaults to uid 1000, which breaks the chart in two ways on a plain cluster:
          #  1. the hostPath directory for the admin socket is created root:root 0755, so the server cannot bind it
          #     ("bind: permission denied"; SPIRE 1.15 then hangs instead of exiting), and
          #  2. the cilium-init sidecar registers Cilium's identities through /proc/<pid>/root of the server process,
          #     which Linux only allows across different users with CAP_SYS_PTRACE. Nothing is registered, every
          #     handshake fails with "no SPIFFE ID" and mutually authenticated traffic is dropped.
          # Running the server as root (as older SPIRE images did) fixes both.
          securityContext:
            runAsUser: 0
            runAsGroup: 0

# Flow visibility, needed to prove what is (not) allowed and authenticated.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

operator:
  replicas: 1
