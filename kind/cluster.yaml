# Single-node kind cluster that publishes the Gateway's NodePorts on the host loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-local
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80,  listenAddress: "127.0.0.1", protocol: TCP }
      - { containerPort: 30443, hostPort: 443, listenAddress: "127.0.0.1", protocol: TCP }
