# Single-node kind cluster for the Cilium setup.
#  - no default CNI and no kube-proxy: Cilium is the CNI and replaces kube-proxy (eBPF)
#  - Cilium's Gateway API runs in host-network mode, so its listeners (8080/8443, ports must be > 1023)
#    live in the node's network namespace; they are published on the host loopback as 80/443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-local
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 8080, hostPort: 80,  listenAddress: "127.0.0.1", protocol: TCP }
      - { containerPort: 8443, hostPort: 443, listenAddress: "127.0.0.1", protocol: TCP }
