server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

metrics_generator:
  ring:
    kvstore:
      store: inmemory
  processor:
    local_blocks:
      flush_to_storage: false
      max_block_duration: 5m
      complete_block_timeout: 30s
    service_graphs:
      dimensions:
        - service.name
    span_metrics:
      dimensions:
        - service.name
  traces_storage:
    path: /var/tempo/generator/traces
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

# This is the critical part — without enabling processors
# in overrides, the generator ring stays empty
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
        - local-blocks

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000