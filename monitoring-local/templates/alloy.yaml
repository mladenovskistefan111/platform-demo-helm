apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ .Release.Namespace }}-alloy }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ .Release.Namespace }}-alloy }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-alloy }
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-config, namespace: {{ .Release.Namespace }} }
data:
  config.alloy: |
{{ .Files.Get "files/alloy.alloy" | replace "__APP_NAMESPACE__" .Values.appNamespace | indent 4 }}
---
{{ include "ml.workload" (dict "root" . "name" "alloy" "uid" 473 "image" (include "ml.image" .Values.images.alloy)
  "serviceAccount" true
  "args" (list "run" "/etc/alloy/config.alloy" "--server.http.listen-addr=0.0.0.0:12345" "--storage.path=/var/lib/alloy/data")
  "ports" (list (dict "name" "otlp-grpc" "port" 4317 "appProtocol" "kubernetes.io/h2c") (dict "name" "pyroscope" "port" 4040) (dict "name" "ui" "port" 12345))
  "probe" (dict "path" "/-/ready" "port" "ui") "resources" .Values.resources.alloy
  "checksum" (.Files.Get "files/alloy.alloy" | sha256sum) "configMap" "alloy-config" "dataPaths" (list "/var/lib/alloy/data")) }}
