apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: {{ .Release.Namespace }} }
data:
  datasources.yaml: |
{{ .Files.Get "files/grafana-datasources.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: {{ .Release.Namespace }} }
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: platform-demo
        type: file
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: {{ .Release.Namespace }} }
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
{{- $env := list (dict "name" "GF_INSTALL_PLUGINS" "value" "grafana-pyroscope-app") }}
{{- if .Values.grafana.anonymousAdmin }}
{{- $env = concat $env (list (dict "name" "GF_AUTH_ANONYMOUS_ENABLED" "value" "true") (dict "name" "GF_AUTH_ANONYMOUS_ORG_ROLE" "value" "Admin") (dict "name" "GF_AUTH_DISABLE_LOGIN_FORM" "value" "true")) }}
{{- end }}
{{- /* Embedding in the portal (iframes of finished dashboards) and, when single sign-on is on, sign-in through Dex. */}}
{{- $env = append $env (dict "name" "GF_SECURITY_ALLOW_EMBEDDING" "value" "true") }}
{{- $mounts := "- { name: ds, mountPath: /etc/grafana/provisioning/datasources }\n- { name: dp, mountPath: /etc/grafana/provisioning/dashboards }\n- { name: dash, mountPath: /etc/grafana/dashboards }" }}
{{- $volumes := "- { name: ds, configMap: { name: grafana-datasources } }\n- { name: dp, configMap: { name: grafana-dashboard-provider } }\n- { name: dash, configMap: { name: grafana-dashboards } }" }}
{{- with .Values.grafana.sso }}
{{- if .enabled }}
{{- $env = concat $env (list
  (dict "name" "GF_AUTH_DISABLE_LOGIN_FORM" "value" "true")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_ENABLED" "value" "true")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_NAME" "value" "Dex")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_CLIENT_ID" "value" "grafana")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" .secretName "key" "GRAFANA_CLIENT_SECRET")))
  (dict "name" "GF_AUTH_GENERIC_OAUTH_SCOPES" "value" "openid profile email groups")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_AUTH_URL" "value" (printf "%s/auth" .issuer))
  (dict "name" "GF_AUTH_GENERIC_OAUTH_TOKEN_URL" "value" (printf "%s/token" .issuer))
  (dict "name" "GF_AUTH_GENERIC_OAUTH_API_URL" "value" (printf "%s/userinfo" .issuer))
  (dict "name" "GF_AUTH_GENERIC_OAUTH_USE_PKCE" "value" "true")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN" "value" "true")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH" "value" "email")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH" "value" "preferred_username")
  (dict "name" "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH" "value" (printf "contains(groups[*], '%s') && 'Admin' || 'Viewer'" .adminGroup))
  (dict "name" "GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN" "value" "false")
  (dict "name" "GF_AUTH_SIGNOUT_REDIRECT_URL" "value" (printf "%s/auth/logout" .issuer))
  (dict "name" "GF_SECURITY_ADMIN_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" .secretName "key" "GRAFANA_ADMIN_PASSWORD")))) }}
{{- if .caConfigMap }}
{{- $env = append $env (dict "name" "GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA" "value" "/etc/platform-demo-ca/ca.crt") }}
{{- $mounts = printf "%s\n- { name: ca, mountPath: /etc/platform-demo-ca, readOnly: true }" $mounts }}
{{- $volumes = printf "%s\n- { name: ca, configMap: { name: %s } }" $volumes .caConfigMap }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.grafana.rootUrl }}
{{- $env = append $env (dict "name" "GF_SERVER_ROOT_URL" "value" .Values.grafana.rootUrl) }}
{{- end }}
{{ include "ml.workload" (dict "root" . "name" "grafana" "uid" 472 "image" (include "ml.image" .Values.images.grafana)
  "env" $env
  "ports" (list (dict "name" "http" "port" 3000))
  "probe" (dict "path" "/api/health" "port" "http") "resources" .Values.resources.grafana
  "checksum" (printf "%s%s" (.Files.Get "files/grafana-datasources.yaml") (toString (.Files.Glob "files/dashboards/*.json")) | sha256sum)
  "dataPaths" (list "/var/lib/grafana")
  "extraMounts" $mounts
  "extraVolumes" $volumes) }}
