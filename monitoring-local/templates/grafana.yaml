apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: {{ .Release.Namespace }} }
data:
  datasources.yaml: |
{{ .Files.Get "files/grafana-datasources.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: {{ .Release.Namespace }} }
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: platform-demo
        type: file
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards, namespace: {{ .Release.Namespace }} }
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
{{- $env := list (dict "name" "GF_INSTALL_PLUGINS" "value" "grafana-pyroscope-app") }}
{{- if .Values.grafana.anonymousAdmin }}
{{- $env = concat $env (list (dict "name" "GF_AUTH_ANONYMOUS_ENABLED" "value" "true") (dict "name" "GF_AUTH_ANONYMOUS_ORG_ROLE" "value" "Admin") (dict "name" "GF_AUTH_DISABLE_LOGIN_FORM" "value" "true")) }}
{{- end }}
{{- if .Values.grafana.rootUrl }}
{{- $env = append $env (dict "name" "GF_SERVER_ROOT_URL" "value" .Values.grafana.rootUrl) }}
{{- end }}
{{ include "ml.workload" (dict "root" . "name" "grafana" "uid" 472 "image" (include "ml.image" .Values.images.grafana)
  "env" $env
  "ports" (list (dict "name" "http" "port" 3000))
  "probe" (dict "path" "/api/health" "port" "http") "resources" .Values.resources.grafana
  "checksum" (printf "%s%s" (.Files.Get "files/grafana-datasources.yaml") (toString (.Files.Glob "files/dashboards/*.json")) | sha256sum)
  "dataPaths" (list "/var/lib/grafana")
  "extraMounts" "- { name: ds, mountPath: /etc/grafana/provisioning/datasources }\n- { name: dp, mountPath: /etc/grafana/provisioning/dashboards }\n- { name: dash, mountPath: /etc/grafana/dashboards }"
  "extraVolumes" "- { name: ds, configMap: { name: grafana-datasources } }\n- { name: dp, configMap: { name: grafana-dashboard-provider } }\n- { name: dash, configMap: { name: grafana-dashboards } }") }}
