apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config, namespace: {{ .Release.Namespace }} }
data:
  loki.yaml: |
{{ .Files.Get "files/loki.yaml" | indent 4 }}
---
{{ include "ml.workload" (dict "root" . "name" "loki" "uid" 10001 "image" (include "ml.image" .Values.images.loki)
  "args" (list "-config.file=/etc/loki/loki.yaml")
  "ports" (list (dict "name" "http" "port" 3100))
  "probe" (dict "path" "/ready" "port" "http") "resources" .Values.resources.loki
  "checksum" (.Files.Get "files/loki.yaml" | sha256sum) "configMap" "loki-config" "dataPaths" (list "/loki")) }}
