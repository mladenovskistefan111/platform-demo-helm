{{- /* Same config as platform-demo-observability/mimir/mimir.yaml */ -}}
apiVersion: v1
kind: ConfigMap
metadata: { name: mimir-config, namespace: {{ .Release.Namespace }} }
data:
  mimir.yaml: |
{{ .Files.Get "files/mimir.yaml" | indent 4 }}
---
{{ include "ml.workload" (dict "root" . "name" "mimir" "uid" 10001 "image" (include "ml.image" .Values.images.mimir)
  "args" (list "-config.file=/etc/mimir/mimir.yaml" "-target=all" "-activity-tracker.filepath=/data/metrics-activity.log")
  "ports" (list (dict "name" "http" "port" 9009) (dict "name" "grpc" "port" 9095))
  "probe" (dict "path" "/ready" "port" "http") "resources" .Values.resources.mimir
  "checksum" (.Files.Get "files/mimir.yaml" | sha256sum) "workingDir" "/data" "configMap" "mimir-config" "dataPaths" (list "/data")) }}
