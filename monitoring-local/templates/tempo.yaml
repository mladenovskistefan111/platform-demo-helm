apiVersion: v1
kind: ConfigMap
metadata: { name: tempo-config, namespace: {{ .Release.Namespace }} }
data:
  tempo.yaml: |
{{ .Files.Get "files/tempo.yaml" | indent 4 }}
---
{{ include "ml.workload" (dict "root" . "name" "tempo" "uid" 10001 "image" (include "ml.image" .Values.images.tempo)
  "args" (list "-config.file=/etc/tempo/tempo.yaml")
  "ports" (list (dict "name" "http" "port" 3200) (dict "name" "otlp-grpc" "port" 4317))
  "probe" (dict "path" "/ready" "port" "http") "resources" .Values.resources.tempo
  "checksum" (.Files.Get "files/tempo.yaml" | sha256sum) "configMap" "tempo-config" "dataPaths" (list "/var/tempo")) }}
