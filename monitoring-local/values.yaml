# Lightweight observability stack. Service names match what Alloy/Grafana/Tempo configs expect
# (alloy, mimir, loki, tempo, pyroscope, grafana) and what the app charts point at
# (alloy.monitoring.svc.cluster.local:4317 / :4040), so install it into the `monitoring` namespace.

appNamespace: platform-demo        # namespace whose database/cache pod logs Alloy tails (they cannot speak OTLP)

images:
  # tag = which version, digest = what actually runs (the kubelet pulls by digest; Kyverno requires one). Bump both together.
  alloy:     { repository: grafana/alloy,     tag: v1.14.2, digest: sha256:eadfe35ea52b26cbec4d4d780fbcc31edb31108c1c9e537ca59557a5a102c712 }
  mimir:     { repository: grafana/mimir,     tag: 3.0.4, digest: sha256:686138d9f941508c99c931cc9e69bf9f6100dd4d2d623bf57b38d5c25ee645c1 }
  loki:      { repository: grafana/loki,      tag: 3.6.7, digest: sha256:3c8fd3570dd9219951a60d3f919c7f31923d10baee578b77bc26c4a0b32d092d }
  tempo:     { repository: grafana/tempo,     tag: 2.10.3, digest: sha256:cac9de2ac9f6da8efca5b64b690a7cb8c786a0c49cac7b4517dd1b0089a6c703 }
  pyroscope: { repository: grafana/pyroscope, tag: 1.19.1, digest: sha256:d5d38187f7593fdf5643ba29e67099206e8d4dee6207f78d028ea3fe621cc04d }
  grafana:   { repository: grafana/grafana,   tag: 12.4.1, digest: sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb }
  pullPolicy: IfNotPresent

grafana:
  # Local demo: anonymous Admin, no login form (same as docker-compose). Never expose this beyond localhost.
  anonymousAdmin: true
  rootUrl: ""                      # e.g. https://grafana.platform-demo.test

resources:
  alloy:     { requests: { cpu: 50m,  memory: 128Mi }, limits: { memory: 512Mi } }
  mimir:     { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
  loki:      { requests: { cpu: 50m,  memory: 192Mi }, limits: { memory: 512Mi } }
  tempo:     { requests: { cpu: 50m,  memory: 192Mi }, limits: { memory: 768Mi } }
  pyroscope: { requests: { cpu: 50m,  memory: 128Mi }, limits: { memory: 512Mi } }
  grafana:   { requests: { cpu: 50m,  memory: 192Mi }, limits: { memory: 512Mi } }
