# Lightweight profile (one replica, no HPA/PDB):  helm install platform-demo . -f values-dev.yaml
# Demo credentials only - never use them outside a throw-away cluster.
x-dev: &dev
  replicaCount: 1
  autoscaling: { enabled: false }
  podDisruptionBudget: { enabled: false }
  topologySpread: { enabled: false }
  preStopSleepSeconds: 0

frontend:                { <<: *dev, service: { type: ClusterIP } }
ad-service:              { <<: *dev }
cart-service:            { <<: *dev }
checkout-service:        { <<: *dev }
currency-service:        { <<: *dev }
email-service:           { <<: *dev }
payment-service:         { <<: *dev }
product-catalog-service: { <<: *dev }
recommendation-service:  { <<: *dev }
shipping-service:        { <<: *dev }

product-catalog-db:
  auth:
    password: catalogdemo
