apiVersion: v2
name: platform-gateway
description: >-
  Gateway API entry point for platform-demo: a GatewayClass backed by Envoy Gateway, one Gateway
  (HTTP :80 redirecting to HTTPS :443) and HTTPRoutes for the shop (frontend) and Grafana.
  Requires Envoy Gateway (which also installs the Gateway API CRDs) and a TLS Secret (see ../kind/README.md).
type: application
version: 0.1.0
appVersion: "1.0"
