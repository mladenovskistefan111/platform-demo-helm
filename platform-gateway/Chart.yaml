apiVersion: v2
name: platform-gateway
description: >-
  Gateway API entry point for platform-demo on Cilium's Gateway API implementation: one Gateway and HTTPRoutes for the shop, Argo CD,
  Hubble, Backstage and Dex (Grafana behind a flag). On AWS TLS ends at the ALB, so the Gateway listens with plain HTTP on the port
  Terraform forwards to (8080, host network); an HTTPS listener with a certificate Secret is optional (`tls.enabled`).
  Requires Cilium with gatewayAPI.enabled and the Gateway API CRDs (both installed by Terraform).
type: application
version: 0.3.0
appVersion: "1.0"
