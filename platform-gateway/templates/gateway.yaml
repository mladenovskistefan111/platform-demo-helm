{{- /*
The GatewayClass `cilium` is created by Cilium itself (gatewayAPI.enabled=true); this chart only declares the Gateway.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.listeners.http }}
      hostname: "*.{{ .Values.domain }}"
      allowedRoutes:
        namespaces: { from: All }
    - name: https
      protocol: HTTPS
      port: {{ .Values.listeners.https }}
      hostname: "*.{{ .Values.domain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - { kind: Secret, name: {{ .Values.gateway.tlsSecretName }} }
      allowedRoutes:
        namespaces: { from: All }
