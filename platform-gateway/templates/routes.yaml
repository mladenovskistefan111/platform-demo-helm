{{- /* Plain HTTP is only used to redirect to HTTPS (the app's cookies are Secure). */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs:
    - { name: {{ .Values.gateway.name }}, sectionName: http }
  hostnames: ["*.{{ .Values.domain }}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
{{- range $name, $r := .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - { name: {{ $.Values.gateway.name }}, namespace: {{ $.Values.gateway.namespace }}, sectionName: https }
  hostnames: [{{ printf "%s.%s" $r.host $.Values.domain | quote }}]
  rules:
    - backendRefs:
        - { name: {{ $r.service }}, port: {{ $r.port }} }
{{- end }}
