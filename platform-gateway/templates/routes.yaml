{{- /* With TLS at the Gateway, plain HTTP only redirects to HTTPS (the applications' cookies are Secure). Behind the ALB the redirect is the ALB's job. */}}
{{- if .Values.tls.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs:
    - { name: {{ .Values.gateway.name }}, sectionName: http }
  hostnames: ["*.{{ .Values.domain }}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
{{- end }}
{{- $section := ternary "https" "http" .Values.tls.enabled }}
{{- range $name, $r := .Values.routes }}
{{- if dig "enabled" true $r }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - { name: {{ $.Values.gateway.name }}, namespace: {{ $.Values.gateway.namespace }}, sectionName: {{ $section }} }
  hostnames: [{{ printf "%s.%s" $r.host $.Values.domain | quote }}]
  rules:
    - {{- with $.Values.forwardedProto }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - { name: X-Forwarded-Proto, value: {{ . | quote }} }
      {{- end }}
      backendRefs:
        - { name: {{ $r.service }}, port: {{ $r.port }} }
{{- end }}
{{- end }}
