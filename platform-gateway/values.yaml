# Hostnames are built from `domain`:  shop, grafana, argocd, hubble, backstage, dex . <domain>
domain: platform-demo.test

# Cilium registers this GatewayClass when gatewayAPI.enabled=true.
gatewayClassName: cilium

gateway:
  name: platform-gateway
  namespace: gateway-system
  tlsSecretName: platform-tls        # kubernetes.io/tls Secret in gateway.namespace covering *.<domain>

# Ports the Gateway listens on. Behind a cloud LoadBalancer use 80/443. With Cilium's host-network mode (kind, bare
# metal without LB) the ports must be > 1023: see values-kind.yaml.
listeners:
  http: 80
  https: 443

routes:
  shop:    { namespace: platform-demo, service: frontend,      port: 80,   host: shop }
  grafana: { namespace: monitoring,    service: grafana,       port: 3000, host: grafana }
  argocd:  { namespace: argocd,        service: argocd-server, port: 80,   host: argocd }
  hubble:  { namespace: kube-system,   service: hubble-ui,     port: 80,   host: hubble }
  backstage: { namespace: backstage,   service: backstage,     port: 80,   host: backstage }
  dex:     { namespace: sso,           service: dex,           port: 80,   host: dex }
