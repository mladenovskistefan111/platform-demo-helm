{{- range .Values.defaultDeny }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: {{ . }}
  labels:
    {{- include "pnp.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Default deny in both directions (kubelet health probes are always allowed by Cilium); the other policies in this namespace add what is needed.
  endpointSelector: {}
  ingress: [{}]
  egress: [{}]
{{- end }}
