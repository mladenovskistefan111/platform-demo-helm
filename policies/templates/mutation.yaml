{{- /* Safe defaults. Mutating Pods only (autogen off): Deployments stay exactly as rendered, so Argo CD sees no drift. */ -}}
{{- define "pd.mpol" }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: pd-{{ .name }}
  labels:
    {{- include "pd.labels" .root | nindent 4 }}
  annotations:
    policies.kyverno.io/title: {{ .title | quote }}
    policies.kyverno.io/description: {{ .description | quote }}
spec:
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    {{- include "pd.nsSelector" (list .root .scope) | nindent 4 }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    {{- .conditions | nindent 4 }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          {{- .patch | nindent 10 }}
{{- end -}}

{{- include "pd.mpol" (dict "root" . "scope" "workload" "name" "default-no-api-token"
  "title" "Pods get no API token unless they ask for one"
  "description" "Sets automountServiceAccountToken=false when a pod does not say anything, so a compromised service has no Kubernetes API credentials."
  "conditions" `- name: unset
  expression: '!has(object.spec.automountServiceAccountToken)'`
  "patch" `Object{ spec: Object.spec{ automountServiceAccountToken: false } }`) }}

{{- include "pd.mpol" (dict "root" . "scope" "workload" "name" "default-seccomp-workload"
  "title" "Default seccomp profile"
  "description" "Adds seccompProfile RuntimeDefault to pods that do not set one."
  "conditions" `- name: unset
  expression: '!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile)'`
  "patch" `Object{ spec: Object.spec{ securityContext: Object.spec.securityContext{ seccompProfile: Object.spec.securityContext.seccompProfile{ type: "RuntimeDefault" } } } }`) }}

{{- include "pd.mpol" (dict "root" . "scope" "platform" "name" "default-seccomp-platform"
  "title" "Default seccomp profile (platform namespaces)"
  "description" "Adds seccompProfile RuntimeDefault to pods that do not set one."
  "conditions" `- name: unset
  expression: '!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile)'`
  "patch" `Object{ spec: Object.spec{ securityContext: Object.spec.securityContext{ seccompProfile: Object.spec.securityContext.seccompProfile{ type: "RuntimeDefault" } } } }`) }}

{{- include "pd.mpol" (dict "root" . "scope" "workload" "name" "backstage-kubernetes-id"
  "title" "Label pods for the developer portal"
  "description" "Copies app.kubernetes.io/name into backstage.io/kubernetes-id, the label the Backstage Kubernetes plugin uses to find a component's pods."
  "conditions" `- name: has-name
  expression: >-
    has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels`
  "patch" `Object{ metadata: Object.metadata{ labels: { "backstage.io/kubernetes-id": object.metadata.labels["app.kubernetes.io/name"] } } }`) }}

{{- /*
gVisor sandbox: pods in namespaces labelled platform.demo/sandbox=gvisor run with runtimeClassName gvisor (RuntimeClass created by
gitops cluster-bootstrap). Selected by the namespace LABEL on purpose (the label is set in one place, the cluster-bootstrap namespace
list, and opting a namespace out is removing it there), unlike the other policies that name their namespaces. Skipped for pods that
cannot run in a user-space kernel (host network/PID/IPC, privileged, hostPath), that already choose a runtime class, or that carry the
opt-out annotation. Fail-closed (see values.yaml): a missing mutation must not mean a silently unsandboxed pod.
*/ -}}
{{- if .Values.sandbox.enabled }}
{{- $sb := .Values.sandbox }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: pd-sandbox-gvisor
  labels:
    {{- include "pd.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: "Pods run in the gVisor sandbox"
    policies.kyverno.io/description: {{ printf "Sets runtimeClassName=%s on pods in namespaces labelled %s=%s. Skipped for host-network/PID/IPC, privileged and hostPath pods, pods that already name a runtime class, and pods annotated %s=disabled." $sb.runtimeClassName $sb.namespaceLabel $sb.namespaceLabelValue $sb.optOutAnnotation | quote }}
spec:
  failurePolicy: {{ $sb.failurePolicy }}
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        {{ $sb.namespaceLabel }}: {{ $sb.namespaceLabelValue | quote }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: runtime-class-unset
      expression: '!has(object.spec.runtimeClassName)'
    - name: not-opted-out
      expression: >-
        !(has(object.metadata.annotations) && {{ $sb.optOutAnnotation | quote }} in object.metadata.annotations &&
          object.metadata.annotations[{{ $sb.optOutAnnotation | quote }}] == 'disabled')
    - name: no-host-namespaces
      expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
    - name: not-privileged
      expression: >-
        !(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])).exists(c,
          has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)
    - name: no-hostpath
      expression: >-
        !has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{ spec: Object.spec{ runtimeClassName: {{ $sb.runtimeClassName | quote }} } }
{{- end }}
