{{- if .Values.verifyImages.enabled }}
{{- $v := .Values.verifyImages }}
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: pd-verify-images
  labels:
    {{- include "pd.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: "Our images are signed by our pipelines"
    policies.kyverno.io/description: "Images from our Docker Hub namespace must carry a keyless cosign signature (classic tag format) made by one of the workflows listed in verifyImages.signers (the publish workflow of platform-demo-workflows, its previous generation, or an old per-repository pipeline) - the same list the Helm CI runs before promotion. What is signed is what Trivy scanned: the release workflow promotes the scanned digest."
spec:
  {{- include "pd.actionSpec" (list . "verify-images" "workload") | nindent 2 }}
  webhookConfiguration:
    timeoutSeconds: 20
  # Admission only: re-verifying every running image each hour (background scan) burns Docker Hub's pull quota for no gain.
  evaluation:
    background: { enabled: false }
  {{- with $v.pullSecret }}
  credentials:
    secrets: [{{ . | quote }}]
  {{- end }}
  matchConstraints:
    {{- include "pd.nsSelector" (list . "workload") | nindent 4 }}
    resourceRules:
      {{- include "pd.podRules" . | nindent 6 }}
  matchImageReferences:
    - glob: {{ $v.glob | quote }}
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            {{- range $v.signers }}
            - issuer: {{ $v.issuer | quote }}
              subjectRegExp: {{ .subjectRegExp | quote }}
            {{- end }}
        ctlog:
          url: {{ $v.rekorUrl | quote }}
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: false
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
      message: image signature verification failed (no valid keyless cosign signature from one of our publish workflows)
{{- end }}
