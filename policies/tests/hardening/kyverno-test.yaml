apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: { name: hardening }
policies: [../../.rendered/hardening.yaml]
resources: [resources.yaml]
results:
  - { policy: pd-require-resources, isValidatingPolicy: true, kind: Pod, resources: [good], result: pass }
  - { policy: pd-require-resources, isValidatingPolicy: true, kind: Pod, resources: [no-requests, no-mem-limit], result: fail }
  - { policy: pd-readonly-rootfs, isValidatingPolicy: true, kind: Pod, resources: [good], result: pass }
  - { policy: pd-readonly-rootfs, isValidatingPolicy: true, kind: Pod, resources: [writable-rootfs], result: fail }
  - { policy: pd-require-probes, isValidatingPolicy: true, kind: Pod, resources: [good], result: pass }
  - { policy: pd-require-probes, isValidatingPolicy: true, kind: Pod, resources: [job-pod-no-probes], result: skip }
  - { policy: pd-require-probes, isValidatingPolicy: true, kind: Pod, resources: [no-probes], result: fail }
  - { policy: pd-service-account, isValidatingPolicy: true, kind: Pod, resources: [good], result: pass }
  - { policy: pd-service-account, isValidatingPolicy: true, kind: Pod, resources: [default-sa, token-mounted, token-unset], result: fail }
