metadata: { name: default-sa, namespace: platform-demo, labels: { app.kubernetes.io/name: x } }
spec:
  serviceAccountName: default
  automountServiceAccountToken: false
  containers:
    - { name: c, image: i }
---
apiVersion: v1
kind: Pod
metadata: { name: token-mounted, namespace: platform-demo, labels: { app.kubernetes.io/name: x } }
spec:
  serviceAccountName: x
  automountServiceAccountToken: true
