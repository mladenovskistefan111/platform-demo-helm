apiVersion: v1
kind: Pod
metadata:
  name: token-and-seccomp-already-set
  namespace: platform-demo
  labels: { app.kubernetes.io/name: frontend, backstage.io/kubernetes-id: frontend }
spec:
  automountServiceAccountToken: true
  securityContext: { seccompProfile: { type: Localhost, localhostProfile: custom.json } }
  containers: [{ name: c, image: i }]
