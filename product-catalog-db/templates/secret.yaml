{{- if not .Values.auth.existingSecret }}
{{- /* Created only when no existing Secret is supplied. Prefer auth.existingSecret (SealedSecrets / External Secrets). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    {{- include "platform-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "auth.password is required (or set auth.existingSecret)" .Values.auth.password | quote }}
{{- end }}
