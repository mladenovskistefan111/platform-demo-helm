# ── Global ────────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: mladenovskistefan/product-catalog-db
  tag: latest
  pullPolicy: IfNotPresent   # change to Never when using a locally loaded image

# ── Namespace ─────────────────────────────────────────────────────────────────
# The chart is installed into whatever namespace `helm install -n <ns>` targets.
# Set createNamespace: true in your install command or pre-create it.

# ── Credentials (sourced from an externally-managed Secret) ───────────────────
# The chart does NOT create the Secret so that credentials are never stored in
# values files or version control.  Create it once with:
#
#   kubectl create secret generic postgres-credentials \
#     --namespace product-catalog-db \
#     --from-literal=POSTGRES_USER=catalog_user \
#     --from-literal=POSTGRES_PASSWORD=<password> \
#     --from-literal=POSTGRES_DB=product_catalog
#
existingSecret: postgres-credentials

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
postgres:
  port: 5432
  user: catalog_user       # used by the readinessProbe only
  database: product_catalog # used by the readinessProbe only

# ── Storage ───────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClassName: ""     # leave empty to use the cluster default StorageClass
  accessMode: ReadWriteOnce
  size: 1Gi

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Probes ────────────────────────────────────────────────────────────────────
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 5432

# ── Network Policy (Cilium) ───────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Namespace where the consuming service lives.
  # The policy selects pods labelled app=product-catalog-service in this namespace.
  clientNamespace: product-catalog
  clientPodSelector:
    app: product-catalog-service

# ── Pod Security ──────────────────────────────────────────────────────────────
podSecurityContext:
  fsGroup: 999            # postgres group so the data volume is writable

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 999          # postgres user
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # postgres writes to /tmp and /var/run
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# ── Pod disruption, affinity, tolerations ─────────────────────────────────────
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
