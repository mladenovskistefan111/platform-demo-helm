{{- if .Values.networkPolicy.enabled }}
# ── CiliumNetworkPolicy ───────────────────────────────────────────────────────
# Ingress  – only namespaces listed in allowedIngressNamespaces may reach
#            the gRPC port (3550).  The metrics port (9090) is additionally
#            open to the same namespace for Prometheus scraping.
# Egress   – only the product-catalog-db pods on port 5432 and DNS are allowed.
#            All other outbound traffic is denied.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "product-catalog-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "product-catalog-service.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "product-catalog-service.selectorLabels" . | nindent 6 }}

  # ── Ingress ──────────────────────────────────────────────────────────────────
  ingress:
    # gRPC traffic from every allowed namespace
    {{- range .Values.networkPolicy.allowedIngressNamespaces }}
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.io/metadata.name: {{ . }}
      toPorts:
        - ports:
            - port: {{ $.Values.app.grpcPort | quote }}
              protocol: TCP
    {{- end }}
    # Metrics scraping — allow Prometheus in the same namespace
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.io/metadata.name: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ .Values.app.metricsPort | quote }}
              protocol: TCP

  # ── Egress ───────────────────────────────────────────────────────────────────
  egress:
    # PostgreSQL — only to product-catalog-db pods in their dedicated namespace
    - toEndpoints:
        - matchLabels:
            {{- range $k, $v := .Values.networkPolicy.dbPodSelector }}
            {{ $k }}: {{ $v }}
            {{- end }}
            io.kubernetes.io/metadata.name: {{ .Values.networkPolicy.dbNamespace }}
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.dbPort | quote }}
              protocol: TCP
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.io/metadata.name: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
